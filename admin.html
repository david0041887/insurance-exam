<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>後台管理 — 保險經紀人考古題</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
  :root, [data-theme="dark"]{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3250;
    --accent:#4f6ef7;--accent2:#7c3aed;--correct:#10b981;--wrong:#ef4444;
    --text:#e8eaf6;--text2:#8b93c4;--text3:#4a5180;--radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
  .header h1{font-size:16px;font-weight:700}
  .header .sp{flex:1}
  .back{font-size:12px;color:var(--text2);text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:6px 12px}
  .back:hover{border-color:var(--accent);color:var(--accent)}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .tile .lbl{font-size:10.5px;letter-spacing:1px;color:var(--text3);font-weight:700;margin-bottom:7px}
  .tile .val{font-size:27px;font-weight:800;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
  .tile .sub{font-size:11px;color:var(--text3);margin-top:6px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .bar input{flex:1;min-width:190px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px;color:var(--text);font-family:inherit;font-size:13px}
  .bar input:focus{outline:none;border-color:var(--accent)}
  .bar select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--text2);font-family:inherit;font-size:12.5px}
  .tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
  th{color:var(--text3);font-weight:700;font-size:10.5px;letter-spacing:.8px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th.l,td.l{text-align:left}
  td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr.blocked td{opacity:.5}
  .who{display:flex;align-items:center;gap:9px}
  .who img,.who .ini{width:28px;height:28px;border-radius:50%;flex-shrink:0}
  .who .ini{background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .who b{color:var(--text);font-weight:600;display:block;font-size:12.5px}
  .who span{color:var(--text3);font-size:10.5px}
  .pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:700}
  .pill.ok{background:rgba(16,185,129,.15);color:var(--correct);border:1px solid rgba(16,185,129,.35)}
  .pill.no{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.4)}
  .pill.adm{background:rgba(124,58,237,.18);color:#a78bfa;border:1px solid rgba(124,58,237,.4)}
  .act{background:transparent;border:1px solid var(--border);border-radius:9px;padding:5px 12px;color:var(--text2);font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .act:hover{border-color:var(--wrong);color:#f87171}
  .act.un:hover{border-color:var(--correct);color:var(--correct)}
  .act:disabled{opacity:.35;cursor:not-allowed}
  .msg{padding:44px 20px;text-align:center;color:var(--text3);font-size:13px}
  .err{color:#f87171}
  details.secs{margin-top:4px}
  details.secs summary{cursor:pointer;color:var(--text3);font-size:10.5px;list-style:none}
  details.secs summary::-webkit-details-marker{display:none}
  details.secs div{font-size:10.5px;color:var(--text3);line-height:1.7;margin-top:4px}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover td{background:rgba(79,110,247,.05)}
  .cov{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .cov .trk{width:64px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
  .cov .fil{height:100%;background:var(--accent);border-radius:0 3px 3px 0}
  .cov span{min-width:38px;text-align:right}
  /* 詳情 */
  .dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:34px 14px;overflow-y:auto}
  .dlg-bg.show{display:flex}
  .dlg{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:860px;padding:24px 26px 26px;position:relative}
  .dlg-x{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--text3);font-size:24px;cursor:pointer;line-height:1}
  .dlg-x:hover{color:var(--text)}
  .dh{display:flex;align-items:center;gap:13px;margin-bottom:20px;padding-right:30px}
  .dh img,.dh .ini{width:46px;height:46px;border-radius:50%;flex-shrink:0}
  .dh .ini{background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
  .dh b{display:block;font-size:17px;color:var(--text)}
  .dh span{font-size:12px;color:var(--text3)}
  .dsec{font-size:11px;letter-spacing:1px;color:var(--text3);font-weight:700;margin:22px 0 10px}
  .dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
  .dtiles .tile{padding:13px 14px}
  .dtiles .tile .val{font-size:22px}
  .chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:2px;padding:0 0 22px;border-bottom:1px solid var(--border)}
  .chart .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
  .chart .b{background:var(--accent);border-radius:4px 4px 0 0;min-height:0;width:100%;max-width:24px;margin:0 auto;transition:opacity .12s}
  .chart .b.zero{background:transparent}
  .chart .col:hover .b{opacity:.75}
  .chart .lbl{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--text3);white-space:nowrap}
  .chart .grid{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
  .chart .gl{position:absolute;right:0;transform:translateY(-100%);font-size:9.5px;color:var(--text3);padding-bottom:2px}
  .tip{position:fixed;pointer-events:none;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--text);z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);line-height:1.6}
  .tip b{color:var(--text)}
  .tip span{color:var(--text2)}
  .stbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
  .stbl th{text-align:right;font-size:10.5px;color:var(--text3);padding:8px 10px;border-bottom:1px solid var(--border)}
  .stbl th:first-child,.stbl td:first-child{text-align:left}
  .stbl td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text2);text-align:right;white-space:nowrap}
  .stbl tr:last-child td{border-bottom:none}
  .stbl .cov .trk{width:90px}
  .stbl tbody tr{cursor:default}
  .stbl tbody tr:hover td{background:none}
  .weak{color:#f87171;font-weight:700}
  .who .nick{display:flex;align-items:center;gap:5px}
  .who .pen{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:1px 3px;border-radius:5px;line-height:1;opacity:0;transition:opacity .12s}
  tbody tr:hover .who .pen{opacity:1}
  .who .pen:focus-visible{opacity:1}
  /* 觸控裝置沒有 hover，鉛筆要一直顯示 */
  @media (hover:none){ .who .pen{opacity:1} }
  .who .pen:hover{color:var(--accent);background:var(--bg)}
  .who .noname{color:var(--text3);font-weight:500;font-style:italic}
  .nick-in{background:var(--bg);border:1px solid var(--accent);border-radius:7px;padding:4px 8px;color:var(--text);font-family:inherit;font-size:12.5px;width:150px}
  .nick-in:focus{outline:none}
  .dh .nickrow{display:flex;align-items:center;gap:8px}
  .dh .pen{background:transparent;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:11px;padding:3px 9px;border-radius:7px;font-family:inherit}
  .dh .pen:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:11px;color:var(--text3);margin:-4px 0 14px}
  .note{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.7}
  @media(max-width:768px){ .wrap{padding:14px 10px 50px} .header{padding:11px 14px}
    .dlg{padding:20px 16px} .chart .lbl{display:none} .chart .lbl.edge{display:block} }
</style>
</head>
<body>
<div class="header">
  <h1>&#128736;&#65039; 後台管理</h1>
  <div class="sp"></div>
  <span id="me" style="font-size:12px;color:var(--text2)"></span>
  <a class="back" href="./">&#8592; 回練習</a>
  <button class="act" id="signout">登出</button>
</div>
<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="搜尋暱稱、姓名或 Email…">
    <select id="filter">
      <option value="all">全部帳號</option>
      <option value="active">啟用中</option>
      <option value="blocked">已停用</option>
      <option value="admin">管理員</option>
    </select>
    <select id="sort">
      <option value="last">最近上線</option>
      <option value="answered">作答數</option>
      <option value="accuracy">正確率</option>
      <option value="created">註冊時間</option>
      <option value="name">名稱</option>
    </select>
  </div>
  <div class="tblwrap"><div class="msg" id="state">載入中…</div><table id="tbl" style="display:none">
    <thead><tr>
      <th class="l">使用者</th><th>練習進度</th><th>作答</th><th>正確率</th><th>錯題池</th>
      <th>連續</th><th>註冊</th><th>最後上線</th><th>狀態</th><th></th>
    </tr></thead><tbody id="rows"></tbody>
  </table></div>
</div>
<div class="dlg-bg" id="dlg"><div class="dlg"><button class="dlg-x" id="dlg-x" aria-label="關閉">&times;</button><div id="dlg-body"></div></div></div>
<div class="tip" id="tip"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var API=window.AUTH_API||'', LS_TOKEN='ins_auth_token_v1';
var ME=null, DATA=[];
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tok(){try{return localStorage.getItem(LS_TOKEN)||'';}catch(e){return '';}}
function api(path,opts){
  opts=opts||{}; var h={};
  if(tok()) h['Authorization']='Bearer '+tok();
  if(opts.body) h['Content-Type']='application/json';
  return fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body})
    .then(function(r){return r.json().then(function(j){return {status:r.status,data:j};});});
}
function fail(m){ el('state').innerHTML='<span class="err">'+esc(m)+'</span>'; el('state').style.display=''; el('tbl').style.display='none'; }
function asDate(d){ if(!d) return null; var t=new Date(d.indexOf('T')<0? d.replace(' ','T')+'Z' : d); return isNaN(t)?null:t; }
function fmt(d){
  var t=asDate(d); if(!t) return '\u2014';
  var diff=(Date.now()-t)/1000;
  if(diff<60) return '\u525b\u525b';
  if(diff<3600) return Math.floor(diff/60)+' \u5206\u524d';
  if(diff<86400) return Math.floor(diff/3600)+' \u5c0f\u6642\u524d';
  if(diff<86400*30) return Math.floor(diff/86400)+' \u5929\u524d';
  return t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate();
}
var SEC_TOTAL={'保險法規概要':1247,'保險學概要':1263,'財產風險管理概要':433,
  '人身風險管理概要':434,'財產保險行銷概要':435,'人身保險行銷概要':435};
var SEC_ORDER=['保險法規概要','保險學概要','財產風險管理概要','人身風險管理概要','財產保險行銷概要','人身保險行銷概要'];
function displayName(r){ return r.nickname || r.name || r.email || '(未命名)'; }
function subName(r){
  // 有暱稱時，副標顯示 Google 原名與 email，方便核對
  var parts=[];
  if(r.nickname && r.name) parts.push(r.name);
  if(r.email) parts.push(r.email);
  return parts.join(' · ');
}
function secStats(r){ try{ return r.section_stats? JSON.parse(r.section_stats):{}; }catch(e){ return {}; } }
function coverage(r){
  var ss=secStats(r), seen=0, tot=0;
  SEC_ORDER.forEach(function(k){ var v=ss[k]||{}; seen+=v.seen||0; tot+=v.total||SEC_TOTAL[k]||0; });
  return tot? seen/tot*100 : 0;
}
function pctTxt(v){ return (v<10&&v>0)? v.toFixed(1) : String(Math.round(v)); }
function covBar(p,w){
  var v=Math.max(0,Math.min(100,p));
  return '<div class="cov"><div class="trk"'+(w?' style="width:'+w+'px"':'')+'><div class="fil" style="width:'+v.toFixed(1)+'%"></div></div><span>'+pctTxt(v)+'%</span></div>';
}
function acc(r){ return r.total_answered? Math.round(r.total_correct/r.total_answered*1000)/10 : 0; }
function tile(l,v,s){ return '<div class="tile"><div class="lbl">'+esc(l)+'</div><div class="val">'+v+'</div><div class="sub">'+esc(s)+'</div></div>'; }

function tiles(rows){
  var n=rows.length;
  var blocked=rows.filter(function(r){return r.is_blocked;}).length;
  var ans=rows.reduce(function(a,r){return a+(r.total_answered||0);},0);
  var cor=rows.reduce(function(a,r){return a+(r.total_correct||0);},0);
  var today=new Date(); today.setHours(0,0,0,0);
  var act=rows.filter(function(r){var d=asDate(r.last_seen_at);return d&&d>=today;}).length;
  var w=new Date(Date.now()-7*86400000);
  var wk=rows.filter(function(r){var d=asDate(r.last_seen_at);return d&&d>=w;}).length;
  el('tiles').innerHTML=
     tile('\u7e3d\u5e33\u865f',n,blocked?(blocked+' \u500b\u5df2\u505c\u7528'):'\u5168\u90e8\u555f\u7528\u4e2d')
   + tile('\u4eca\u65e5\u6d3b\u8e8d',act,'\u904e\u53bb 7 \u5929 '+wk+' \u4eba')
   + tile('\u7d2f\u8a08\u4f5c\u7b54',ans.toLocaleString(),'\u5168\u7ad9')
   + tile('\u6574\u9ad4\u6b63\u78ba\u7387',(ans?Math.round(cor/ans*1000)/10:0)+'%','\u7b54\u5c0d '+cor.toLocaleString()+' \u984c');
}

function render(){
  var q=el('q').value.trim().toLowerCase();
  var f=el('filter').value, sort=el('sort').value;
  var rows=DATA.filter(function(r){
    if(f==='active'&&r.is_blocked) return false;
    if(f==='blocked'&&!r.is_blocked) return false;
    if(f==='admin'&&!r.is_admin) return false;
    if(q&&((r.nickname||'')+' '+(r.name||'')+' '+(r.email||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  rows.sort(function(a,b){
    if(sort==='answered') return (b.total_answered||0)-(a.total_answered||0);
    if(sort==='accuracy') return acc(b)-acc(a);
    if(sort==='created') return String(b.created_at||'').localeCompare(String(a.created_at||''));
    if(sort==='name') return displayName(a).localeCompare(displayName(b),'zh-Hant');
    return String(b.last_seen_at||'').localeCompare(String(a.last_seen_at||''));
  });
  tiles(DATA);
  if(!rows.length){ el('state').textContent='\u6c92\u6709\u7b26\u5408\u689d\u4ef6\u7684\u5e33\u865f'; el('state').style.display=''; el('tbl').style.display='none'; return; }
  el('state').style.display='none'; el('tbl').style.display='';
  el('rows').innerHTML=rows.map(function(r){
    var disp=displayName(r), sub=subName(r);
    var av=r.avatar? '<img src="'+esc(r.avatar)+'" alt="" referrerpolicy="no-referrer">'
                   : '<span class="ini">'+esc(disp.slice(0,1))+'</span>';
    var isMe=ME&&r.id===ME.id;
    return '<tr data-uid="'+esc(r.id)+'"'+(r.is_blocked?' class="blocked"':'')+'>'
      + '<td class="l"><div class="who">'+av+'<div>'
        + '<div class="nick"><b'+(r.nickname?'':' class="noname"')+'>'+esc(disp)+'</b>'
        + '<button class="pen" data-nick="'+esc(r.id)+'" title="設定暱稱">✎</button></div>'
        + '<span>'+esc(sub)+'</span></div></div></td>'
      + '<td>'+covBar(coverage(r))+'</td>'
      + '<td>'+(r.total_answered||0).toLocaleString()+'</td>'
      + '<td>'+acc(r)+'%</td>'
      + '<td>'+(r.wrong_pool||0)+'</td>'
      + '<td>'+(r.streak_days||0)+' \u5929</td>'
      + '<td>'+fmt(r.created_at)+'</td>'
      + '<td>'+fmt(r.last_seen_at)+'</td>'
      + '<td>'+(r.is_admin?'<span class="pill adm">\u7ba1\u7406\u54e1</span> ':'')
             +(r.is_blocked?'<span class="pill no">\u5df2\u505c\u7528</span>':'<span class="pill ok">\u555f\u7528\u4e2d</span>')+'</td>'
      + '<td>'+(isMe? '<button class="act" disabled title="\u4e0d\u80fd\u9396\u81ea\u5df1">\u672c\u4eba</button>'
          : '<button class="act'+(r.is_blocked?' un':'')+'" data-id="'+esc(r.id)+'" data-b="'+(r.is_blocked?1:0)+'">'
            +(r.is_blocked?'\u89e3\u9664\u505c\u7528':'\u505c\u7528\u5e33\u865f')+'</button>')+'</td></tr>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#rows .act[data-id]'),function(b){
    b.onclick=function(ev){ ev.stopPropagation(); toggleBlock(b.dataset.id,b.dataset.b==='1'); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#rows tr[data-uid]'),function(tr){
    tr.onclick=function(){ openDetail(tr.dataset.uid); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#rows .pen[data-nick]'),function(b){
    b.onclick=function(ev){ ev.stopPropagation(); editNickname(b.dataset.nick); };
  });
}

// ── 使用者練習詳情 ──────────────────────────────
function closeDetail(){ el('dlg').className='dlg-bg'; el('tip').style.display='none'; }
function openDetail(id){
  el('dlg-body').innerHTML='<div class="msg">載入中…</div>';
  el('dlg').className='dlg-bg show';
  api('/api/admin/user?id='+encodeURIComponent(id)+'&days=30').then(function(r){
    if(r.status!==200){ el('dlg-body').innerHTML='<div class="msg err">讀取失敗：'+esc((r.data&&r.data.error)||r.status)+'</div>'; return; }
    renderDetail(r.data);
  }).catch(function(){ el('dlg-body').innerHTML='<div class="msg err">無法連線</div>'; });
}

function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function renderDetail(d){
  var u=d.user, name=displayName(u);
  var av=u.avatar? '<img src="'+esc(u.avatar)+'" alt="" referrerpolicy="no-referrer">' : '<span class="ini">'+esc(name.slice(0,1))+'</span>';
  var lt=d.lifetime||{};
  var h='<div class="dh">'+av+'<div>'
    +'<div class="nickrow"><b>'+esc(name)+'</b>'
    +'<button class="pen" id="dlg-nick">'+(u.nickname?'✎ 改暱稱':'✎ 設暱稱')+'</button></div>'
    +'<span>'+esc(subName(u)||u.email||'')
    +' · 註冊 '+fmt(u.created_at)+' · 最後上線 '+fmt(u.last_seen_at)+'</span></div></div>';

  // 概況
  h+='<div class="dtiles">'
    + tile('練習進度', pctTxt(coverage(u))+'%', '題庫覆蓋率')
    + tile('累計作答', (u.total_answered||0).toLocaleString(), '答對 '+(u.total_correct||0).toLocaleString())
    + tile('正確率', acc(u)+'%', '全部作答')
    + tile('活躍天數', (lt.active_days||0), '連續 '+(u.streak_days||0)+' 天')
    + tile('錯題池', (u.wrong_pool||0), '待複習')
    + tile('收藏', (u.bookmarks||0), '題')
    + '</div>';

  // 近 30 天
  var map={}; (d.activity||[]).forEach(function(a){ map[a.day]=a; });
  var days=[], today=new Date(); today.setHours(0,0,0,0);
  for(var i=(d.days||30)-1;i>=0;i--){ var t=new Date(today); t.setDate(t.getDate()-i); var k=dayKey(t); days.push({k:k,d:t,a:map[k]||{answered:0,correct:0}}); }
  var mx=Math.max.apply(null,days.map(function(x){return x.a.answered;}));
  var sum30=days.reduce(function(a,x){return a+x.a.answered;},0);
  var act30=days.filter(function(x){return x.a.answered>0;}).length;
  h+='<div class="dsec">近 30 天每日作答題數　<span style="font-weight:400;letter-spacing:0">共 '+sum30+' 題，'+act30+' 天有練習</span></div>';
  if(!mx){
    h+='<div class="msg" style="padding:26px">近 30 天沒有練習紀錄</div>';
  } else {
    var top=niceMax(mx);
    h+='<div class="chart" id="chart">';
    [0.5,1].forEach(function(f){ h+='<div class="grid" style="bottom:calc(22px + (100% - 22px)*'+f+')"><span class="gl">'+Math.round(top*f)+'</span></div>'; });
    days.forEach(function(x,i){
      var pct=x.a.answered/top*100;
      var lab=(i===0||i===days.length-1||x.d.getDate()===1||x.d.getDay()===1)? (x.d.getMonth()+1)+'/'+x.d.getDate() : '';
      h+='<div class="col" data-i="'+i+'"><div class="b'+(x.a.answered?'':' zero')+'" style="height:'+pct.toFixed(1)+'%"></div>'
        + (lab?'<span class="lbl'+((i===0||i===days.length-1)?' edge':'')+'">'+lab+'</span>':'')+'</div>';
    });
    h+='</div>';
  }

  // 各科
  var ss=secStats(u);
  var rows=SEC_ORDER.map(function(k){
    var v=ss[k]||{}, tot=v.total||SEC_TOTAL[k]||0, seen=v.seen||0;
    var avg=seen? (v.stars||0)/seen : 0;
    return {k:k,tot:tot,seen:seen,mastered:v.mastered,wrong:v.wrong,avg:avg,cov:tot?seen/tot*100:0,hasNew:v.total!=null};
  });
  var practiced=rows.filter(function(x){return x.seen>=20;});
  var weakest=practiced.length? practiced.slice().sort(function(a,b){return a.avg-b.avg;})[0] : null;
  h+='<div class="dsec">各科練習狀況</div><div style="overflow-x:auto"><table class="stbl"><thead><tr>'
    +'<th>科目</th><th>進度</th><th>練過 / 總題數</th><th>精熟（3星）</th><th>錯題</th><th>平均星數</th></tr></thead><tbody>';
  rows.forEach(function(x){
    var isWeak=weakest&&x.k===weakest.k&&practiced.length>1;
    h+='<tr><td'+(isWeak?' class="weak" title="已練科目中平均星數最低"':'')+'>'+esc(x.k)+(isWeak?' ⚠':'')+'</td>'
      +'<td>'+covBar(x.cov,90)+'</td>'
      +'<td>'+x.seen+' / '+x.tot+'</td>'
      +'<td>'+(x.mastered!=null?x.mastered:'—')+'</td>'
      +'<td>'+(x.wrong!=null?x.wrong:'—')+'</td>'
      +'<td>'+(x.seen?x.avg.toFixed(2):'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var legacy=rows.some(function(x){return x.seen&&!x.hasNew;});
  h+='<p class="note">「精熟」＝連續答對累積到 3 顆星；答錯會歸零。平均星數越低代表該科越常答錯。'
    +(weakest&&practiced.length>1?'<br>⚠ 標記已練 20 題以上的科目中最弱的一科。':'')
    +(legacy?'<br>「—」表示該使用者尚未用新版同步，下次練習後會補上。':'')
    +'</p>';

  el('dlg-body').innerHTML=h;
  var pen=el('dlg-nick');
  if(pen) pen.onclick=function(){ editNickname(u.id,function(){ openDetail(u.id); }); };

  // 長條圖 hover
  var tip=el('tip');
  Array.prototype.forEach.call(document.querySelectorAll('#chart .col'),function(c){
    c.onmousemove=function(ev){
      var x=days[+c.dataset.i], a=x.a;
      var w=['日','一','二','三','四','五','六'][x.d.getDay()];
      tip.innerHTML='<b>'+(x.d.getMonth()+1)+'/'+x.d.getDate()+'（'+w+'）</b><br>'
        +(a.answered? '<span>作答</span> '+a.answered+' 題　<span>答對</span> '+a.correct+' 題<br><span>正確率</span> '+Math.round(a.correct/a.answered*100)+'%'
                    : '<span>沒有練習</span>');
      tip.style.display='block';
      var tx=ev.clientX+14, ty=ev.clientY-10;
      if(tx+tip.offsetWidth>window.innerWidth-8) tx=ev.clientX-tip.offsetWidth-14;
      tip.style.left=tx+'px'; tip.style.top=ty+'px';
    };
    c.onmouseleave=function(){ tip.style.display='none'; };
  });
}
function niceMax(v){
  if(v<=5) return 5;
  var p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;
}

function editNickname(id, onDone){
  var r=DATA.filter(function(x){return x.id===id;})[0];
  var cur=r? (r.nickname||'') : '';
  var who=r? (r.name||r.email||id) : id;
  var v=prompt('為「'+who+'」設定暱稱（留空可清除，最多 30 字）：', cur);
  if(v===null) return;
  api('/api/admin/nickname',{method:'POST',body:JSON.stringify({id:id,nickname:v})})
    .then(function(res){
      if(res.status!==200){ alert('設定失敗：'+((res.data&&res.data.error)||res.status)); return; }
      if(r) r.nickname=res.data.nickname;
      render();
      if(onDone) onDone(res.data.nickname);
    });
}

function toggleBlock(id,blocked){
  var row=DATA.filter(function(r){return r.id===id;})[0];
  var who=(row&&(row.name||row.email))||id;
  var note=null;
  if(!blocked){
    note=prompt('\u505c\u7528\u300c'+who+'\u300d\u7684\u5e33\u865f\uff1f\n\u53ef\u586b\u5165\u539f\u56e0\uff08\u9078\u586b\uff0c\u6703\u986f\u793a\u7d66\u8a72\u4f7f\u7528\u8005\uff09\uff1a','');
    if(note===null) return;
  } else if(!confirm('\u89e3\u9664\u505c\u7528\u300c'+who+'\u300d\uff1f')) return;
  api('/api/admin/block',{method:'POST',body:JSON.stringify({id:id,blocked:!blocked,note:note||null})})
    .then(function(r){
      if(r.status!==200){ alert('\u64cd\u4f5c\u5931\u6557\uff1a'+((r.data&&r.data.error)||r.status)); return; }
      load();
    });
}

function load(){
  api('/api/admin/users').then(function(r){
    if(r.status!==200){ fail('\u8b80\u53d6\u5931\u6557\uff1a'+((r.data&&r.data.error)||r.status)); return; }
    DATA=r.data.users||[]; render();
  }).catch(function(){ fail('\u7121\u6cd5\u9023\u7dda\u5230\u767b\u5165\u670d\u52d9'); });
}

function boot(){
  if(!API){ fail('\u5c1a\u672a\u5728 config.js \u8a2d\u5b9a Worker \u7db2\u5740'); return; }
  el('signout').onclick=function(){ try{localStorage.removeItem(LS_TOKEN);}catch(e){} location.href='./'; };
  ['q','filter','sort'].forEach(function(id){ el(id).addEventListener('input',render); });
  el('dlg-x').onclick=closeDetail;
  el('dlg').addEventListener('click',function(e){ if(e.target===el('dlg')) closeDetail(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDetail(); });
  if(!tok()){ location.href='./'; return; }
  api('/api/me').then(function(r){
    if(r.status!==200||!r.data.user){ location.href='./'; return; }
    if(!r.data.user.is_admin){ fail('\u9019\u500b\u5e33\u865f\u6c92\u6709\u5f8c\u53f0\u6b0a\u9650'); return; }
    ME=r.data.user;
    el('me').textContent=ME.name||ME.email||'';
    load();
  }).catch(function(){ fail('\u7121\u6cd5\u9023\u7dda\u5230\u767b\u5165\u670d\u52d9'); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
